# POLIS CI — Implementation Plan task 1.10
#
# Gate order matters: lint and secret-scan are cheap and fail fast; the
# dependency audit and tests come after. Every job here BLOCKS merge to
# `develop` and `main` (SEC-28). Branch protection must require them.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — SEC-18 scans every commit, not just HEAD
      # Run the binary directly instead of gitleaks/gitleaks-action@v2. The action
      # derives an incremental commit range from the push event and scans only
      # that. After the Week 1 author rewrite the range referenced the parent of
      # the root commit, so git errored, gitleaks scanned 0 bytes, and the only
      # reason this was caught is that the step happened to exit non-zero. A scan
      # that can silently cover nothing is not a gate. This form always scans the
      # full history the fetch-depth above already pays for, and drops a
      # third-party action from the supply chain.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Assert .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed. It must never be (SEC-17)."
            exit 1
          fi

      - name: Assert .env.example holds no real values
        run: |
          # Every credential-shaped key must have an EMPTY value after the '='.
          #
          # Two things this must NOT do, both learned from false positives:
          #   1. Match the word anywhere in the key. ACCESS_TOKEN_MINUTES=15 is a
          #      duration, not a token, so the key must END with the word.
          #   2. Count a trailing comment as a value. `JWT_SECRET=   # 32+ bytes`
          #      is empty, so comments are stripped before the test.
          if sed -E 's/[[:space:]]*#.*$//' .env.example \
             | grep -nE '^[A-Za-z0-9_]*(SECRET|PASSWORD|TOKEN|API_KEY|API_ID|CLIENT_ID|HASH)=[[:space:]]*[^[:space:]]'; then
            echo "::error::.env.example contains a non-empty secret value (SEC-17)."
            exit 1
          fi

  python:
    name: Python lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # TRD §4.2 target. Local dev is currently on 3.10 — see README "Known gaps".
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch index: the CUDA wheel is ~2.5GB and blows the runner
          # disk/time budget for no benefit — production is CPU-only (ADR-007).
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # NFR-5.1 requires >=70% on backend + ingestion business logic. Not enforced
      # as a hard gate yet: at Week 1 the codebase is a skeleton, so the number is
      # meaningless. Turn this on in Phase 5 when there is logic to cover.
      # - name: Coverage gate
      #   run: coverage report --fail-under=70

      - name: pip-audit (SEC-24)
        run: pip-audit --requirement requirements.txt --strict

  frontend:
    name: Frontend lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: npm audit (SEC-24)
        run: npm audit --omit=dev --audit-level=high
